<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Financeiro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="titulo">
            <h1>Assistente Financeiro</h1>

            <div class="periodo">
                <select id="seletor-mes">
                    <option value="0">Janeiro</option>
                    <option value="1">Fevereiro</option>
                    <option value="2">Março</option>
                    <option value="3">Abril</option>
                    <option value="4">Maio</option>
                    <option value="5">Junho</option>
                    <option value="6">Julho</option>
                    <option value="7">Agosto</option>
                    <option value="8">Setembro</option>
                    <option value="9">Outubro</option>
                    <option value="10">Novembro</option>
                    <option value="11">Dezembro</option>
                </select>

                <select id="seletor-ano">
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>

        </div>

            <nav class="menu">
                <a href="index.html" class="ativo">Visão geral</a>
                <a href="metas.html">Metas</a>
            </nav>

    </header>




    <main>
        <section id="resumo">

            <article class="card card-saldo">
                <h2>Saldo</h2>
                <p id="valor-saldo">R$ 0,00</p>
                <span id="comparacao-saldo" class="comparacao"></span>
            </article>

            <article class="card card-receitas">
                <h2>Receitas</h2>
                <p id="valor-receitas">R$ 0,00</p>
            </article>

            <article class="card card-despesas">
                <h2>Despesas</h2>
                <p id="valor-despesas">R$ 0,00</p>
            </article>

            <article class="card card-guardado">
                <h2>Guardado</h2>
                <p id="valor-guardado">R$ 0,00</p>
            </article>

        </section>

        <section id="graficos">

            <article class="card card-grafico">
                <h2>Receitas × Despesas</h2>
                <div class="grafico-pizza" id="grafico-receitas-despesas"></div>
                <ul class="legenda" id="legenda-receitas-despesas"></ul>
            </article>

            <article class="card card-grafico">
                <h2>Despesas por categoria</h2>
                <div class="grafico-pizza" id="grafico-categorias"></div>
                <ul class="legenda" id="legenda-categorias"></ul>
            </article>

        </section>

        <section id="movimentacoes">
            <h2>Movimentações recentes</h2>
            <ul id="lista-movimentacoes"></ul>
        </section>

    </main>

    <button id="btn-adicionar" type="button">+</button>

    <div id="modal" class="modal">
        <div class="modal-conteudo">
            <h2 id="modal-titulo">Nova movimentação</h2>

            <form id="form-movimentacao">

                <label for="tipo">Tipo</label>
                <select id="tipo">
                    <option value="despesa">Despesa</option>
                    <option value="receita">Receita</option>
                </select>

                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" placeholder="Ex.: Mercado">

                <label for="valor">Valor</label>
                <input type="number" id="valor" step="0.01" min="0.01">

                <label for="categoria">Categoria</label>
                <select id="categoria"></select>

                <label for="data">Data</label>
                <input type="date" id="data">

                <div id="campo-recorrencia">
                    <input type="checkbox" id="recorrente">
                    <label for="recorrente">Repetir todo mês</label>
                </div>

                <div class="botoes-form">
                    <button type="button" id="btn-cancelar">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>

            </form>
        </div>
    </div>

    <script src="js/avisos.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
